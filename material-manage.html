<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Câu Hỏi Trắc Nghiệm - Toán Smart</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- KaTeX CSS for Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    
    <!-- Custom CSS Styles -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        body {
            background-color: #F8FAFC;
            color: #1E293B;
            font-family: 'Be Vietnam Pro', sans-serif;
            margin: 0;
            padding: 0;
        }

        .manage-wrapper {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 24px;
        }

        /* Top Navigation Header */
        .manage-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            background: #FFFFFF;
            padding: 20px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
            border: 1px solid #E2E8F0;
        }

        .manage-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            color: #0F172A;
        }

        .manage-breadcrumb {
            font-size: 0.88rem;
            color: #64748B;
            margin-top: 4px;
        }

        .manage-breadcrumb span {
            color: var(--accent-color);
            font-weight: 600;
        }

        /* Config & Action Bar */
        .config-bar {
            background: #FFFFFF;
            padding: 20px 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
            border: 1px solid #E2E8F0;
            margin-bottom: 24px;
        }

        .config-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 16px;
        }

        .config-select {
            flex: 1;
            min-width: 200px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #CBD5E1;
            font-size: 0.88rem;
            outline: none;
            background-color: #FFFFFF;
            transition: border-color 0.2s;
        }

        .config-select:focus {
            border-color: var(--accent-color);
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-container input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            border-top: 1px solid #F1F5F9;
            padding-top: 16px;
        }

        .action-buttons .btn {
            width: auto;
            padding: 10px 20px;
            font-size: 0.88rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-radius: 8px;
        }

        /* 2 Column Layout */
        .columns-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .column-card {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03);
            border: 1px solid #E2E8F0;
            padding: 24px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        .column-card h3 {
            margin: 0 0 16px 0;
            font-size: 1.15rem;
            font-weight: 700;
            color: #0F172A;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .column-card h3 span.badge {
            font-size: 0.78rem;
            font-weight: 600;
            background: #EFF6FF;
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 999px;
        }

        .questions-list-container {
            flex-grow: 1;
            overflow-y: auto;
            max-height: 70vh;
            padding-right: 4px;
        }

        /* Question Item Cards */
        .q-card {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            transition: all 0.2s;
            position: relative;
        }

        .q-card:hover {
            border-color: #CBD5E1;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.02);
        }

        .q-card.selected-item {
            background: #F0FDFA;
            border-color: #A7F3D0;
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            font-size: 0.82rem;
            color: #64748B;
        }

        .q-id {
            font-weight: 700;
        }

        .q-text {
            font-size: 0.92rem;
            line-height: 1.6;
            color: #1E293B;
            margin-bottom: 12px;
            word-break: break-word;
        }

        .q-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px dashed #E2E8F0;
            padding-top: 12px;
            margin-top: 12px;
        }

        .q-badges {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .diff-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .diff-nb { background: #D1FAE5; color: #065F46; }
        .diff-th { background: #DBEAFE; color: #1E40AF; }
        .diff-vd { background: #FEF3C7; color: #92400E; }
        .diff-vdc { background: #FEE2E2; color: #991B1B; }

        .q-actions {
            display: flex;
            gap: 6px;
        }

        .q-actions .btn {
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            width: auto;
        }

        .q-actions .btn-select {
            background: var(--accent-color);
            color: #FFFFFF;
        }

        .q-actions .btn-select:hover {
            background: #4F46E5;
        }

        .q-actions .btn-unselect {
            background: #FEE2E2;
            color: #EF4444;
        }

        .q-actions .btn-unselect:hover {
            background: #FCA5A5;
        }

        /* Drag handle for selected list */
        .drag-handle {
            cursor: grab;
            color: #94A3B8;
            padding: 6px;
            margin-right: 4px;
            display: flex;
            align-items: center;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        /* Sortable ghost class */
        .sortable-ghost {
            opacity: 0.4;
            background: #EEF2FF;
            border: 2px dashed var(--accent-color);
        }

        /* Modal styling */
        .admin-modal-content {
            max-width: 750px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .qb-preview-panel {
            background: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 16px;
            margin-top: 12px;
        }

        .qb-preview-title {
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .preview-box {
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .q-preview-explanation {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed #CBD5E1;
            font-size: 0.82rem;
            color: #475569;
        }

        /* Interactive KaTeX test preview toggles */
        .q-preview-expanded-panel {
            background: #F1F5F9;
            border-radius: 8px;
            padding: 12px;
            margin-top: 10px;
            font-size: 0.85rem;
            line-height: 1.5;
            border-left: 3px solid var(--accent-color);
        }

        @media (max-width: 1024px) {
            .columns-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="manage-wrapper">
        
        <!-- Top Nav Header -->
        <div class="manage-header">
            <div>
                <h2>Thiết Kế Bộ Đề Trắc Nghiệm</h2>
                <div class="manage-breadcrumb" id="manageBreadcrumb">
                    Đang tải lộ trình bài học...
                </div>
            </div>
            <a href="#" id="backBtn" class="btn btn-secondary" style="width: auto; padding: 10px 20px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
                <i class="fa-solid fa-arrow-left"></i> Quay lại Góc học tập
            </a>
        </div>

        <!-- Filters & Action Toolbar -->
        <div class="config-bar">
            <div class="config-filters">
                <select class="config-select" id="qbFilterCourse">
                    <option value="">Tất cả khóa học</option>
                </select>
                <select class="config-select" id="qbFilterChapter">
                    <option value="">Tất cả chương</option>
                </select>
                <select class="config-select" id="qbFilterLesson">
                    <option value="">Tất cả bài học</option>
                </select>
                <select class="config-select" id="qbFilterMaterial">
                    <option value="">Tất cả học liệu</option>
                </select>
                <label class="checkbox-container">
                    <input type="checkbox" id="qbFilterChdc">
                    <span>Lấy theo CHDC</span>
                </label>
            </div>
            
            <div class="action-buttons">
                <button class="btn btn-primary" id="addQuestionBtn">
                    <i class="fa-solid fa-plus"></i> Tạo câu hỏi mới
                </button>
                <button class="btn btn-secondary" id="clearAllBtn" style="color: #EF4444; border-color: #FCA5A5; background: #FFF5F5;">
                    <i class="fa-solid fa-trash-can"></i> Xóa tất cả trong học liệu này
                </button>
            </div>
        </div>

        <!-- 2 Columns Source / Selected -->
        <div class="columns-grid">
            
            <!-- Left Column: Source Bank -->
            <div class="column-card">
                <h3>
                    <span>Ngân Hàng Câu Hỏi Nguồn</span>
                    <span class="badge" id="sourceCount">0 câu hỏi</span>
                </h3>
                <div class="questions-list-container" id="sourceList">
                    <!-- Dynamic question items -->
                </div>
            </div>

            <!-- Right Column: Selected list for current Quiz -->
            <div class="column-card" style="border-color: #A7F3D0;">
                <h3>
                    <span style="color: #065F46;">Câu Hỏi Được Chọn (Học Sinh Sẽ Làm)</span>
                    <span class="badge" style="background: #D1FAE5; color: #047857;" id="selectedCount">0 câu hỏi</span>
                </h3>
                <div class="questions-list-container" id="selectedList">
                    <!-- Dynamic linked items with drag handles -->
                </div>
            </div>

        </div>

    </div>

    <!-- Visual Question CRUD Modal -->
    <div class="admin-modal" id="questionModal">
        <div class="admin-modal-content">
            <button class="admin-modal-close" onclick="closeQuestionModal()"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="admin-modal-title" id="questionModalTitle">Thêm câu hỏi mới</h3>
            
            <!-- Thanh công cụ chèn nhanh công thức Toán học -->
            <div class="math-quick-toolbar" style="background: #F1F5F9; border: 1px solid #E2E8F0; border-radius: 8px; padding: 8px; margin-bottom: 16px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
                <span style="font-size: 0.72rem; font-weight: 700; color: #475569; margin-right: 6px;"><i class="fa-solid fa-calculator"></i> Chèn nhanh:</span>
                <button type="button" class="math-btn" data-latex="$$" title="Bọc công thức LaTeX" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">$ $</button>
                <button type="button" class="math-btn" data-latex="\frac{}{} " title="Phân số" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">x/y</button>
                <button type="button" class="math-btn" data-latex="\sqrt{} " title="Căn thức" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">√x</button>
                <button type="button" class="math-btn" data-latex="^{} " title="Số mũ" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">xⁿ</button>
                <button type="button" class="math-btn" data-latex="_{} " title="Chỉ số dưới" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">xₙ</button>
                <button type="button" class="math-btn" data-latex="\pm " title="Cộng trừ" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">±</button>
                <button type="button" class="math-btn" data-latex="\Delta " title="Delta" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">Δ</button>
                <button type="button" class="math-btn" data-latex="\pi " title="Số Pi" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">π</button>
                <button type="button" class="math-btn" data-latex="\alpha " title="Alpha" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">α</button>
                <button type="button" class="math-btn" data-latex="\beta " title="Beta" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">β</button>
                <button type="button" class="math-btn" data-latex="\le " title="Nhỏ hơn hoặc bằng" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">≤</button>
                <button type="button" class="math-btn" data-latex="\ge " title="Lớn hơn hoặc bằng" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">≥</button>
                <button type="button" class="math-btn" data-latex="\int_{}^{} " title="Tích phân" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">∫</button>
                <button type="button" class="math-btn" data-latex="\lim_{x \to } " title="Giới hạn" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">lim</button>
                <button type="button" class="math-btn" data-latex="\log_{}{} " title="Logarit" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">log</button>
                <button type="button" class="math-btn" data-latex="\vec{} " title="Vectơ" style="background: #FFFFFF; border: 1px solid #CBD5E1; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; cursor: pointer; transition: all 0.2s;">→</button>
            </div>
            
            <form id="questionForm" onsubmit="saveQuestion(event)">
                
                <div class="form-group">
                    <label class="form-label" style="font-weight: 600;">Độ khó</label>
                    <div style="display: flex; gap: 16px;">
                        <label class="checkbox-container" style="font-weight: 500;"><input type="radio" name="qfDifficulty" value="NB" checked> <span class="diff-badge diff-nb">Nhận biết</span></label>
                        <label class="checkbox-container" style="font-weight: 500;"><input type="radio" name="qfDifficulty" value="TH"> <span class="diff-badge diff-th">Thông hiểu</span></label>
                        <label class="checkbox-container" style="font-weight: 500;"><input type="radio" name="qfDifficulty" value="VD"> <span class="diff-badge diff-vd">Vận dụng</span></label>
                        <label class="checkbox-container" style="font-weight: 500;"><input type="radio" name="qfDifficulty" value="VDC"> <span class="diff-badge diff-vdc">Vận dụng cao</span></label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" style="font-weight: 600;">Nội dung câu hỏi <span style="font-weight: 400; color: #64748B;">(Hỗ trợ LaTeX: $x^2$)</span></label>
                    <textarea class="form-control" id="qfQuestionText" rows="3" placeholder="Nhập nội dung câu hỏi..." oninput="updateQuestionPreview()" required></textarea>
                </div>

                <div class="modal-form-grid">
                    <div class="form-group" style="margin-bottom: 8px;">
                        <label class="form-label" style="font-weight: 600;">Đáp án A</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="radio" name="qfCorrect" value="0" checked>
                            <input type="text" class="form-control" id="qfOptionA" placeholder="Nhập đáp án A" oninput="updateQuestionPreview()" required>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 8px;">
                        <label class="form-label" style="font-weight: 600;">Đáp án B</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="radio" name="qfCorrect" value="1">
                            <input type="text" class="form-control" id="qfOptionB" placeholder="Nhập đáp án B" oninput="updateQuestionPreview()" required>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 8px;">
                        <label class="form-label" style="font-weight: 600;">Đáp án C</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="radio" name="qfCorrect" value="2">
                            <input type="text" class="form-control" id="qfOptionC" placeholder="Nhập đáp án C" oninput="updateQuestionPreview()" required>
                        </div>
                    </div>
                    <div class="form-group" style="margin-bottom: 8px;">
                        <label class="form-label" style="font-weight: 600;">Đáp án D</label>
                        <div style="display: flex; gap: 8px; align-items: center;">
                            <input type="radio" name="qfCorrect" value="3">
                            <input type="text" class="form-control" id="qfOptionD" placeholder="Nhập đáp án D" oninput="updateQuestionPreview()" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" style="font-weight: 600;">Hướng dẫn giải chi tiết <span style="font-weight: 400; color: #64748B;">(Tùy chọn, hỗ trợ LaTeX)</span></label>
                    <textarea class="form-control" id="qfExplanation" rows="2" placeholder="Nhập lời giải..." oninput="updateQuestionPreview()"></textarea>
                </div>

                <!-- Live Preview panel -->
                <div class="qb-preview-panel">
                    <div class="qb-preview-title"><i class="fa-solid fa-eye"></i> Xem trước trực tiếp</div>
                    <div id="qbPreviewContent" class="preview-box">
                        <p style="color: #94A3B8; font-style: italic; margin: 0;">Nhập nội dung câu hỏi để bắt đầu xem trước...</p>
                    </div>
                </div>

                <div class="modal-footer" style="margin-top: 16px;">
                    <button type="button" class="btn btn-secondary" onclick="closeQuestionModal()">Hủy bỏ</button>
                    <button type="submit" class="btn btn-primary" style="width: auto;">Lưu câu hỏi</button>
                </div>

            </form>
        </div>
    </div>

    <!-- CDNs and Libraries -->
    <!-- Supabase JS client -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <!-- SortableJS drag drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <!-- KaTeX library -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    
    <!-- Core config & Action Script -->
    <script src="js/config.js"></script>
    <script src="js/material-manage.js"></script>

</body>
</html>
